[platformio]
src_dir = ../firmware/src
include_dir = ../firmware/include
extra_configs = ../platformio-common.ini
default_envs = esp32

[env:esp32]
build_flags =
    -I .
    -D DEVICE_ID=\"esp32-cs3-c301\"
    -D ROOM_ID=\"C301\"
